<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="winDocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000080" />
      <stop offset="100%" stop-color="#1084d0" />
    </linearGradient>
  </defs>
  <!-- Classic Retro Computer & Document Icon -->
  <rect x="2" y="4" width="22" height="18" fill="#c0c0c0" stroke="#000" stroke-width="1.5"/>
  <rect x="4" y="6" width="18" height="12" fill="#008080" stroke="#808080" stroke-width="1"/>
  <!-- Bevel edges -->
  <line x1="2" y1="4" x2="24" y2="4" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="2" y1="4" x2="2" y2="22" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Stand -->
  <polygon points="11,22 15,22 17,26 9,26" fill="#808080" stroke="#000" stroke-width="1"/>
  <rect x="6" y="26" width="14" height="2" fill="#dfdfdf" stroke="#000" stroke-width="1"/>
  <!-- Floating classic yellow document / folder overlay -->
  <polygon points="16,11 23,11 28,16 28,29 16,29" fill="#ffffc0" stroke="#000" stroke-width="1.5"/>
  <polygon points="23,11 23,16 28,16" fill="#dcd896" stroke="#000" stroke-width="1"/>
  <!-- Document lines -->
  <line x1="19" y1="18" x2="25" y2="18" stroke="#000080" stroke-width="1.2"/>
  <line x1="19" y1="21" x2="25" y2="21" stroke="#000080" stroke-width="1.2"/>
  <line x1="19" y1="24" x2="23" y2="24" stroke="#000080" stroke-width="1.2"/>
</svg>