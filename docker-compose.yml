services:
  postgres:
    image: 'postgres:18'
    environment:
      POSTGRES_DB: swendoc
      POSTGRES_USER: swendoc
      POSTGRES_PASSWORD: secret
    # 5433 on the host: Homebrew postgres@18 already owns 5432.
    ports:
      - '5433:5432'
    # postgres:18+ wants the mount one level up, at /var/lib/postgresql, so that the
    # data lands in a version-specific subdirectory that pg_upgrade can work with.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swendoc -d swendoc']
      interval: 2s
      timeout: 3s
      retries: 15

  minio:
    image: 'minio/minio:latest'
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build: .
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/swendoc
      MINIO_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres-data:
  minio-data:
