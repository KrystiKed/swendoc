services:
  postgres:
    image: 'postgres:18'
    environment:
      POSTGRES_DB: swendoc
      POSTGRES_USER: swendoc
      POSTGRES_PASSWORD: secret
    # 5433 on the host: Homebrew postgres@18 already owns 5432.
    ports:
      - '5433:5432'
    # postgres:18+ wants the mount one level up, at /var/lib/postgresql, so that the
    # data lands in a version-specific subdirectory that pg_upgrade can work with.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swendoc -d swendoc']
      interval: 2s
      timeout: 3s
      retries: 15

  minio:
    image: 'pgsty/minio:latest'
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: 'rabbitmq:4-management'
    # Fixed hostname: RabbitMQ stores its data under the node name, which otherwise is the
    # random container hostname and would orphan the volume on every recreate.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmqadmin
      RABBITMQ_DEFAULT_PASS: rabbitmqadmin
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      target: app
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/swendoc
      MINIO_URL: http://minio:9000
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: rabbitmqadmin
      SPRING_RABBITMQ_PASSWORD: rabbitmqadmin
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ocrworker:
    build:
      context: ./ocrworker
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: rabbitmqadmin
      SPRING_RABBITMQ_PASSWORD: rabbitmqadmin
    depends_on:
      rabbitmq:
        condition: service_healthy

  webui:
    build:
      context: .
      target: webui
    ports:
      - '80:80'
    depends_on:
      - app

volumes:
  postgres-data:
  minio-data:
  rabbitmq-data:
