name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: REST server (tests + 70% coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/

  ocrworker:
    name: OCR worker (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocrworker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ocrworker/pom.xml
      - run: ./mvnw -B verify

  frontend:
    name: Web UI (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  docker:
    name: docker compose build
    runs-on: ubuntu-latest
    needs: [backend, ocrworker, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
