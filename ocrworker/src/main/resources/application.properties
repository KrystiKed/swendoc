spring.application.name=ocrworker
spring.main.web-application-type=none

# Defaults target the compose RabbitMQ from the host; the ocrworker container overrides
# SPRING_RABBITMQ_HOST to reach rabbitmq:5672 on the compose network.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=rabbitmqadmin
spring.rabbitmq.password=rabbitmqadmin
