services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=swendoc'
      - 'POSTGRES_USER=swendoc'
      - 'POSTGRES_PASSWORD=secret'
    # No fixed host port: you already run Homebrew postgres@18 on 5432. Compose picks a free
    # port and Boot's docker-compose support discovers it, so the two never collide.
    ports:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swendoc -d swendoc']
      interval: 2s
      timeout: 3s
      retries: 15

  minio:
    image: 'quay.io/minio/minio:latest'
    command: server /data --console-address ":9001"
    environment:
      - 'MINIO_ROOT_USER=minioadmin'
      - 'MINIO_ROOT_PASSWORD=minioadmin'
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 2s
      timeout: 3s
      retries: 15
