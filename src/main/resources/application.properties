spring.application.name=swendoc

# Defaults target the compose Postgres from the host; the app container overrides
# SPRING_DATASOURCE_URL to reach postgres:5432 on the compose network.
spring.datasource.url=jdbc:postgresql://localhost:5433/swendoc
spring.datasource.username=swendoc
spring.datasource.password=secret

# ponytail: ddl-auto=update is fine for coursework; swap for Flyway once the schema is graded
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket=documents

# Validation messages come from messages*.properties in the request's Accept-Language;
# without a header (or for an unsupported language) English, not the server's OS locale.
spring.web.locale=en
spring.messages.fallback-to-system-locale=false
