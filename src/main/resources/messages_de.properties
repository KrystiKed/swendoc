# Validierungsmeldungen (Deutsch). {min}/{max}/{maxMb} sind die Attribute der Constraints.
validation.required=Bitte füllen Sie dieses Feld aus.
validation.maxLength=Darf höchstens {max} Zeichen lang sein.
validation.length=Muss zwischen {min} und {max} Zeichen lang sein.
validation.fileRequired=Bitte wählen Sie eine Datei aus.
validation.fileSize=Die Datei darf nicht leer und höchstens {maxMb} MB groß sein.
