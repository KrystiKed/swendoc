# Validation messages (English, also the fallback). {min}/{max}/{maxMb} are the constraint attributes.
validation.required=Please fill in this field.
validation.maxLength=Must be at most {max} characters long.
validation.length=Must be between {min} and {max} characters long.
validation.fileRequired=Please choose a file.
validation.fileSize=The file must not be empty and may be at most {maxMb} MB.
